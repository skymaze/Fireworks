# Fireworks 生产部署（中国大陆版）：面向局域网内部管理工具。
# 与 docker-compose.prod.yml（国际版，GHCR 源）的唯一区别：镜像源为阿里云
# （registry.cn-shanghai.aliyuncs.com/aixn-public/fireworks-*，发布 CI 自动推送）。
# 拓扑：域名与 TLS 交由上层中间件/反向代理终结（nginx / haproxy / Caddy / 网关均可），
#       控制平面栈自身不终结 TLS、不申请证书。
#
# HTTPS（先让中间件把整个站点反向代理到前端 :3000）：
#   FW_IMAGE_TAG=0.10.0 docker compose -f docker-compose.prod.cn.yml up -d --pull always
# HTTP（仅本机或可信内网）：
#   FW_IMAGE_TAG=0.10.0 COOKIE_SECURE=0 docker compose -f docker-compose.prod.cn.yml up -d --pull always
#
# 网络拓扑：
#   浏览器 ──HTTPS──> 中间件(终结 TLS/域名)
#                       └──> 前端 :3000 ──/api、/api/ws/events 代理──> 后端 :8000（栈内）
#   节点 Agent 经管理网直接访问后端 :8000（回拉模型/镜像，节点独立 token 认证）。
#   8000 必须绑定所有宿主机接口，确保所有 Agent 可达；限制来源请使用防火墙或网络 ACL。
#
# 中间件配置示例见 deploy/nginx-fireworks.conf.example（含 WebSocket 升级头与转发头）。
# 由中间件终结 TLS 后，会话 cookie 需标记 Secure（COOKIE_SECURE=1，本文件已设）——
# 浏览器仅经 HTTPS 携带该 cookie；中间件若同时开放明文 HTTP 会自动丢弃带 Secure 的 cookie，
# 实现“HTTPS-only”的兜底。
#
# 存储分层（SSD/HDD 分流）：
#   默认使用命名卷 fireworks-db / fireworks-cache —— 跨平台最兼容（Windows/macOS/Linux 一致），
#   Docker 管理位置与权限，容量取决于 Docker 数据盘（Docker Desktop 还受虚拟磁盘上限约束）。
#   大模型部署建议在 .env 中设置 FIREWORKS_DB_PATH / FIREWORKS_CACHE_PATH，直接绑定
#   到指定 SSD/HDD；例如 /mnt/ssd/fireworks/db 与 /mnt/hdd/fireworks/cache。

services:
  backend:
    # 默认使用阿里云预构建镜像（中国大陆源；发布 CI 与 GHCR 同步推送）。
    # 国际版/自建源：设 IMAGE_REGISTRY 与 IMAGE_OWNER，或改用 docker-compose.prod.yml。
    # 离线/自托管可改回本地构建：注释掉 image: 行、放开下方 build: 段（二者不要同时启用，
    # 镜像已存在时 compose up 不会重建）。
    image: ${IMAGE_REGISTRY:-registry.cn-shanghai.aliyuncs.com}/${IMAGE_OWNER:-aixn-public}/fireworks-backend:${FW_IMAGE_TAG:-latest}
    # build:
    #   # 上下文为仓库根：镜像需要打包 agent/（部署脚本，容器内「部署 Agent」用），
    #   # 而 agent/ 在仓库根而非 backend/ 下，故不能以 ./backend 为上下文。
    #   context: .
    #   dockerfile: backend/Dockerfile
    container_name: fireworks-backend
    restart: unless-stopped
    # 节点 Agent 经管理网回拉模型/镜像使用（端点携带节点独立 token 认证）。
    # 必须绑定所有宿主机接口；限制来源请使用防火墙或网络 ACL，不要缩窄绑定地址。
    ports:
      - "8000:8000"
    volumes:
      # 高频（建议 SSD）：SQLite 数据库 + 审计日志
      - ${FIREWORKS_DB_PATH:-fireworks-db}:/data/db
      # 低频大文件（建议 HDD）：模型缓存 + 镜像归档
      - ${FIREWORKS_CACHE_PATH:-fireworks-cache}:/data/cache
    environment:
      - DATABASE_URL=sqlite:////data/db/fireworks.db
      - AUDIT_LOG_PATH=/data/db/audit.log
      - MODEL_CACHE_DIR=/data/cache/models
      - IMAGE_CACHE_DIR=/data/cache/images
      - RECIPE_SRC_DIR=/data/cache/recipes-src
      - METRIC_POLL_INTERVAL=5
      - METRIC_RETENTION_HOURS=24
      - INFERENCE_RETENTION_HOURS=${INFERENCE_RETENTION_HOURS:-25}
      - AGENT_PORT=9000
      - AGENT_DEPLOY_DIR=/opt/fireworks-agent
      # 节点 Agent 镜像：默认阿里云（本文件为中国大陆版），可用环境变量覆盖
      # HTTPS 部署：会话 cookie 强制 Secure（1/true/yes 开启）；纯 HTTP 本机/内网
      # 试用可设 COOKIE_SECURE=0（否则浏览器不保存 HTTPS-only cookie）
      - COOKIE_SECURE=${COOKIE_SECURE:-1}
    healthcheck:
      # python 镜像无 curl/wget，用 urllib 探活；后端 health 校验 SQLite 可写 → readiness
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    image: ${IMAGE_REGISTRY:-registry.cn-shanghai.aliyuncs.com}/${IMAGE_OWNER:-aixn-public}/fireworks-frontend:${FW_IMAGE_TAG:-latest}
    # build: ./frontend
    container_name: fireworks-frontend
    restart: unless-stopped
    # 上游中间件把站点反代到 :3000。端口对局域网开放、访问依赖登录会话。
    ports:
      - "3000:3000"
    environment:
      - API_PROXY_TARGET=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s


volumes:
  # 未设置 FIREWORKS_DB_PATH / FIREWORKS_CACHE_PATH 时使用以下命名卷。
  fireworks-db:
  fireworks-cache:
