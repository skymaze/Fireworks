# Fireworks - DGX Spark 集群管理工具（控制平面）
# 用法: docker compose up -d --build
#   前端: http://localhost:3000 （首次访问「初始化」建号，此后登录使用；REST 与实时 WS 均经此端口）
#
# 认证与安全：
# - 控制平面全部接口要求登录会话（HttpOnly cookie）；登录失败按 IP 限速，关键操作审计日志。
# - WebSocket 实时通道经前端 /api/ws 同源代理，浏览器不直连后端。
# - 后端 8000 端口需保持发布：节点 Agent 经管理网回拉模型/镜像文件使用（携带共享 AGENT_TOKEN 认证）。
#   可将 8000 仅绑定管理网段（如 "10.0.0.5:8000:8000"），进一步缩小暴露面（生产见 docker-compose.prod.yml）。
#
# 存储分层（默认命名卷，最兼容/跨平台；生产 SSD/HDD 分流见 docker-compose.prod.yml）：
# - fireworks-db：高频小文件 —— SQLite 数据库 + 审计日志（建议 SSD）
# - fireworks-cache：低频大文件 —— 模型缓存 + 镜像归档（建议 HDD）
#   需要精确落盘时，用 `driver: local` + bind 把命名卷固定到目标磁盘（见 prod 文件示例）。
#
# 生产部署提示：
# - 局域网内部工具：域名与 TLS 交由上层中间件（nginx/haproxy/网关）终结，栈内不自行终结；
#   中间件把站点（含 /api、/api/ws/events）反向代理到前端 :3000 即可（示例见
#   deploy/nginx-fireworks.conf.example），并设 COOKIE_SECURE=1。
# - AGENT_TOKEN 建议显式配置（否则自动生成并持久化到 settings 表）：需与节点 Agent 部署时下发的
#   DGX_AGENT_TOKEN 一致；轮换后需重新部署节点 Agent。
#
# 说明：
# - 镜像分发使用 skopeo（镜像内置），直接拉取/导出，不依赖宿主 docker daemon，
#   代理可通过「模型管理-下载设置-镜像拉取代理」配置。
# - 模型/镜像缓存与数据库统一持久化到 fireworks-data 卷。

services:
  backend:
    # 本地构建；镜像名与 GHCR 预构建保持一致（CI 同源构建，见 .github/workflows/build-images.yml），
    # 本地产物可直接 docker push 发布，或与生产拓扑（docker-compose.prod.yml）无缝切换。
    image: ghcr.io/${IMAGE_OWNER:-skymaze}/fireworks/backend:${FW_IMAGE_TAG:-latest}
    # 上下文为仓库根：镜像需要打包 agent/ 安装包（容器内「部署 Agent」用），
    # 而 agent/ 在仓库根而非 backend/ 下，故不能以 ./backend 为上下文。
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fireworks-backend
    ports:
      - "8000:8000"
    volumes:
      # 高频（建议 SSD）：SQLite 数据库 + 审计日志
      - fireworks-db:/data/db
      # 低频大文件（建议 HDD）：模型缓存 + 镜像归档
      - fireworks-cache:/data/cache
    environment:
      - DATABASE_URL=sqlite:////data/db/fireworks.db
      - AUDIT_LOG_PATH=/data/db/audit.log
      - MODEL_CACHE_DIR=/data/cache/models
      - IMAGE_CACHE_DIR=/data/cache/images
      - METRIC_POLL_INTERVAL=5
      - METRIC_RETENTION_HOURS=24
      - AGENT_PORT=9000
      - AGENT_DEPLOY_DIR=/opt/dgx-agent
      # 认证可选配置：SESSION_TTL_HOURS / CORS_ORIGINS / COOKIE_SECURE / AGENT_TOKEN
      # HTTPS 部署时开启：COOKIE_SECURE=1
    restart: unless-stopped
    healthcheck:
      # python 镜像无 curl/wget，用 urllib 探活；后端 health 校验 SQLite 可写 → readiness
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    image: ghcr.io/${IMAGE_OWNER:-skymaze}/fireworks/frontend:${FW_IMAGE_TAG:-latest}
    build: ./frontend
    container_name: fireworks-frontend
    ports:
      - "3000:3000"
    environment:
      # 前端服务端代理 /api 到后端（Nitro routeRules proxy）
      - API_PROXY_TARGET=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  fireworks-db:
  fireworks-cache: