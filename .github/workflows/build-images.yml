name: build-images

# 构建并推送预构建镜像到 GHCR（ghcr.io/<owner>/fireworks/{backend,frontend}），
# 每个镜像同时产出 linux/amd64 与 linux/arm64 两个平台（docker manifest list）。
#
# 触发：
#   - 推送 semver 标签（vX.Y.Z）→ 正式发布：vX.Y.Z / X.Y.Z / X.Y / latest
#   - 推送 main 分支            → 滚动构建：main / sha-<短哈希>
#   - 手动触发（workflow_dispatch）
#
# 拉取方（docker compose 生产部署）无需登录：仓库为公开时 GHCR 匿名可拉。
# 注意：需在 GitHub 仓库 Settings → Actions → General → Workflow permissions
# 选择 "Read and write permissions"，否则推送会被拒（403）。

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: .
            file: backend/Dockerfile
          - service: frontend
            context: ./frontend
            file: Dockerfile
          # 节点 Agent 镜像：控制平面经 SSH docker load 分发（参考 Portainer Agent）
          - service: agent
            context: .
            file: agent/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # arm64 构建依赖 QEMU 模拟（runner 为 amd64）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 标签规范：见文件头注释
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 命名 <registry>/<owner>/fireworks-<service>（与阿里云同步目标一致，见 README）
          images: ghcr.io/${{ github.repository_owner }}/fireworks-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 跨平台共享 GHA 缓存，加速重复构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
