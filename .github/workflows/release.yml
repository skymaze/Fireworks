name: release

# 发布流水线：仅在推送 v* 发布标签时构建并推送多架构镜像（GHCR）并创建 GitHub Release。
# 手动触发（workflow_dispatch）用于补跑构建，不自动创建 Release。
# 日常提交不触发本流程，只跑 validate.yml（typecheck + 单测），不构建镜像。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write       # 创建 GitHub Release
  packages: write       # 推送 GHCR 镜像
  attestations: write   # actions/attest 供应链声明
  id-token: write

jobs:
  build:
    name: build-${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: .
            file: backend/Dockerfile
          - service: frontend
            context: ./frontend
            file: frontend/Dockerfile
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/fireworks-${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # arm64 构建依赖 QEMU 模拟（runner 为 amd64）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 标签：semver 打 {{version}}/{{major}}.{{minor}}/{{major}}；sha 便于溯源；
      # latest 仅在稳定发布（非 -rc/-beta 预发布）时打
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable=${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}

      - name: Build and push (linux/amd64 + linux/arm64)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: create-release
    needs: build
    runs-on: ubuntu-latest
    # 仅 push 发布标签时自动建 Release；手动 dispatch 不建
    if: github.event_name == 'push'
    steps:
      - name: Create GitHub Release (auto-generated notes)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "::notice::Release ${tag} 已存在，跳过创建"
          else
            gh release create "${tag}" --generate-notes --title "${tag}"
          fi
