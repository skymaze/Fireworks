# Fireworks 生产部署（示例）：面向局域网内部管理工具。
# 拓扑：域名与 TLS 交由上层中间件/反向代理终结（nginx / haproxy / Caddy / 网关均可），
#       控制平面栈自身不终结 TLS、不申请证书。
#
# 用法（中间件把站点的所有路径反向代理到前端 :3000 后）：
#   MGMT_BIND_ADDR=10.0.0.5 docker compose -f docker-compose.prod.yml up -d --build
#
# 网络拓扑：
#   浏览器 ──HTTPS──> 中间件(终结 TLS/域名)
#                       └──> 前端 :3000 ──/api、/api/ws/events 代理──> 后端 :8000（栈内）
#   节点 Agent 经管理网直接访问后端 :8000（回拉模型/镜像，AGENT_TOKEN 认证；
#   因此 :8000 仅绑定管理网卡，公网/其它网段不可达）。
#
# 中间件配置示例见 deploy/nginx-fireworks.conf.example（含 WebSocket 升级头与转发头）。
# 由中间件终结 TLS 后，会话 cookie 需标记 Secure（COOKIE_SECURE=1，本文件已设）——
# 浏览器仅经 HTTPS 携带该 cookie；中间件若同时开放明文 HTTP 会自动丢弃带 Secure 的 cookie，
# 实现“HTTPS-only”的兜底。
#
# 存储分层（SSD/HDD 分流）：
#   默认使用命名卷 fireworks-db / fireworks-cache —— 跨平台最兼容（Windows/macOS/Linux 一致），
#   Docker 管理位置与权限，备份用 docker volume 工具即可。
#   生产要精确落盘（SSD/HDD）时，按文件底部 volumes 段的 driver:local+bind 示例，
#   把命名卷固定到目标磁盘：Linux 如 /mnt/ssd/fireworks/db；Windows 如 D:\fireworks\db。

services:
  backend:
    # 默认使用 GHCR 预构建镜像（多架构 amd64/arm64，CI 推送，见 .github/workflows/build-images.yml）。
    # 离线/自托管可改回本地构建：注释掉 image: 行、放开下方 build: 段（二者不要同时启用，
    # 镜像已存在时 compose up 不会重建）。命令：docker compose -f docker-compose.prod.yml build
    image: ghcr.io/${IMAGE_OWNER:-skymaze}/fireworks/backend:${FW_IMAGE_TAG:-latest}
    # build:
    #   # 上下文为仓库根：镜像需要打包 agent/ 安装包（容器内「部署 Agent」用），
    #   # 而 agent/ 在仓库根而非 backend/ 下，故不能以 ./backend 为上下文。
    #   context: .
    #   dockerfile: backend/Dockerfile
    container_name: fireworks-backend
    restart: unless-stopped
    # 仅绑定管理网卡：节点 Agent 回拉模型/镜像使用（端点携带 AGENT_TOKEN 认证）
    ports:
      - "${MGMT_BIND_ADDR:-127.0.0.1}:8000:8000"
    volumes:
      # 高频（建议 SSD）：SQLite 数据库 + 审计日志
      - fireworks-db:/data/db
      # 低频大文件（建议 HDD）：模型缓存 + 镜像归档
      - fireworks-cache:/data/cache
    environment:
      - DATABASE_URL=sqlite:////data/db/fireworks.db
      - AUDIT_LOG_PATH=/data/db/audit.log
      - MODEL_CACHE_DIR=/data/cache/models
      - IMAGE_CACHE_DIR=/data/cache/images
      - METRIC_POLL_INTERVAL=5
      - METRIC_RETENTION_HOURS=24
      - AGENT_PORT=9000
      - AGENT_DEPLOY_DIR=/opt/dgx-agent
      # HTTPS 部署：会话 cookie 强制 Secure
      - COOKIE_SECURE=1
      - AGENT_TOKEN=${AGENT_TOKEN:-}
    healthcheck:
      # python 镜像无 curl/wget，用 urllib 探活；后端 health 校验 SQLite 可写 → readiness
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    image: ghcr.io/${IMAGE_OWNER:-skymaze}/fireworks/frontend:${FW_IMAGE_TAG:-latest}
    # build: ./frontend
    container_name: fireworks-frontend
    restart: unless-stopped
    # 供上游中间件访问。默认绑定回环：
    #   - 中间件与栈同机（nginx 指 127.0.0.1:3000）→ 无需修改；
    #   - 中间件在局域网其它主机 → 设 WEB_BIND_ADDR=管理网IP（如 10.0.0.5）使其可达。
    # 若中间件以另一个 compose 服务直接指到本服务名，可去掉 ports 项。
    ports:
      - "${WEB_BIND_ADDR:-127.0.0.1}:3000:3000"
    environment:
      - API_PROXY_TARGET=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s


volumes:
  fireworks-db:
  fireworks-cache:
  # ---- SSD/HDD 落盘示例：把命名卷固定到具体磁盘（取消注释并按实际盘符/挂载点填写）----
